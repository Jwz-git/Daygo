<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Daygo discrete frames timeline concept</title>
  <desc id="desc">Four separated screen frames gather along a rising timeline, representing private interval capture organized into a day.</desc>
  <g id="icon">
    <path
      id="timeline"
      d="M78 370 C148 350 184 302 232 269 C286 232 335 183 432 142"
      fill="none"
      stroke="#141417"
      stroke-width="28"
      stroke-linecap="round"
    />

    <g id="frame-morning" transform="rotate(-18 125 343)">
      <rect x="82" y="291" width="86" height="104" rx="20" fill="#3977C3"/>
      <rect x="98" y="307" width="54" height="17" rx="8.5" fill="#EEF2F9"/>
    </g>

    <g id="frame-midday" transform="rotate(-18 217 276)">
      <rect x="174" y="224" width="86" height="104" rx="20" fill="#4B8DF0"/>
      <rect x="190" y="240" width="54" height="17" rx="8.5" fill="#EEF2F9"/>
    </g>

    <g id="frame-afternoon" transform="rotate(-18 309 208)">
      <rect x="266" y="156" width="86" height="104" rx="20" fill="#7A6EA8"/>
      <rect x="282" y="172" width="54" height="17" rx="8.5" fill="#EEF2F9"/>
    </g>

    <g id="frame-evening" transform="rotate(-18 397 151)">
      <rect x="354" y="99" width="86" height="104" rx="20" fill="#3977C3"/>
      <rect x="370" y="115" width="54" height="17" rx="8.5" fill="#EEF2F9"/>
    </g>
  </g>
</svg>
