name: Build release installers

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build_macos: ${{ steps.check.outputs.build_macos }}
      build_windows: ${{ steps.check.outputs.build_windows }}
    steps:
      - name: Check existing release assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test -n "$version" || { echo 'Release version is empty.' >&2; exit 1; }

          mac_asset="Daygo-${version}-universal.dmg"
          win_asset="Daygo-${version}-amd64-installer.exe"
          assets="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"

          if grep -Fxq "$mac_asset" <<<"$assets"; then
            echo "macOS asset already exists: $mac_asset"
            echo "build_macos=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_macos=true" >> "$GITHUB_OUTPUT"
          fi

          if grep -Fxq "$win_asset" <<<"$assets"; then
            echo "Windows asset already exists: $win_asset"
            echo "build_windows=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_windows=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    if: needs.prepare.outputs.build_macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        run: |
          brew install create-dmg
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Package macOS installer
        env:
          DAYGO_ARCH: universal
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/package-macos.sh "$VERSION"

      - name: Upload macOS installer to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          asset="dist/Daygo-${VERSION}-universal.dmg"
          test -f "$asset" || { echo "macOS installer not found: $asset" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "$asset" --clobber

  windows:
    needs: prepare
    if: needs.prepare.outputs.build_windows == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        shell: pwsh
        run: |
          choco install mingw nsis -y --no-progress
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Package Windows installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .\scripts\package-windows.ps1 -Version $env:VERSION

      - name: Upload Windows installer to release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $asset = Join-Path 'dist' "Daygo-$env:VERSION-amd64-installer.exe"
          if (-not (Test-Path $asset -PathType Leaf)) { throw "Windows installer not found: $asset" }
          gh release upload $env:RELEASE_TAG $asset --clobber
