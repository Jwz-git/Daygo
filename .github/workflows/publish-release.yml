name: Build release installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      build_macos: ${{ steps.check.outputs.build_macos }}
      build_windows: ${{ steps.check.outputs.build_windows }}
      is_prerelease: ${{ steps.check.outputs.is_prerelease }}
    steps:
      - name: Check existing release assets
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a vX.Y.Z release tag.' >&2; exit 1; }
          release_draft="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isDraft --jq '.isDraft')"
          test "$release_draft" = 'false' || { echo 'Release must be published.' >&2; exit 1; }
          is_prerelease="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json isPrerelease --jq '.isPrerelease')"
          echo "is_prerelease=$is_prerelease" >> "$GITHUB_OUTPUT"

          mac_asset="Daygo-${version}-arm64.dmg"
          win_asset="Daygo-${version}-amd64-installer.exe"
          assets="$(gh release view "$RELEASE_TAG" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"

          if grep -Fxq "$mac_asset" <<<"$assets"; then
            echo "macOS asset already exists: $mac_asset"
            echo "build_macos=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_macos=true" >> "$GITHUB_OUTPUT"
          fi

          if grep -Fxq "$win_asset" <<<"$assets"; then
            echo "Windows asset already exists: $win_asset"
            echo "build_windows=false" >> "$GITHUB_OUTPUT"
          else
            echo "build_windows=true" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    needs: prepare
    if: needs.prepare.outputs.build_macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        run: |
          brew install create-dmg
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      # Import the persisted self-signed identity so every release carries the
      # same designated requirement and the Screen Recording (TCC) grant keyed
      # to it survives updates. When the secrets are absent the step is a no-op
      # and package-macos.sh falls back to ad-hoc signing (unstable DR), so a
      # fork without the certificate still produces a build.
      - name: Import signing certificate
        env:
          DAYGO_DEV_CERT_P12_BASE64: ${{ secrets.DAYGO_DEV_CERT_P12_BASE64 }}
          DAYGO_DEV_CERT_P12_PASSWORD: ${{ secrets.DAYGO_DEV_CERT_P12_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DAYGO_DEV_CERT_P12_BASE64}" || -z "${DAYGO_DEV_CERT_P12_PASSWORD}" ]]; then
            echo 'No signing certificate configured; package-macos.sh will ad-hoc sign.'
            exit 0
          fi
          keychain="$RUNNER_TEMP/daygo-signing.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          p12="$RUNNER_TEMP/daygo-cert.p12"
          printf '%s' "$DAYGO_DEV_CERT_P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$DAYGO_DEV_CERT_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain" >/dev/null
          # Prepend the temp keychain to the search list so codesign resolves the
          # identity, keeping the existing keychains (quotes stripped for reuse).
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          echo 'DAYGO_DEV_SIGN_IDENTITY=Daygo Dev' >> "$GITHUB_ENV"
          echo 'Imported self-signed identity "Daygo Dev".'

      - name: Package macOS installer
        env:
          DAYGO_ARCH: arm64
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/package-macos.sh "$VERSION"

      - name: Upload macOS installer to release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          asset="dist/Daygo-${VERSION}-arm64.dmg"
          test -f "$asset" || { echo "macOS installer not found: $asset" >&2; exit 1; }
          gh release upload "$RELEASE_TAG" "$asset" --clobber

      - name: Clean up signing keychain
        if: always()
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/daygo-signing.keychain-db" 2>/dev/null || true

  windows:
    needs: prepare
    if: needs.prepare.outputs.build_windows == 'true'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install build tools
        shell: pwsh
        run: |
          choco install mingw nsis -y --no-progress
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Package Windows installer
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .\scripts\package-windows.ps1 -Version $env:VERSION

      - name: Upload Windows installer to release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $asset = Join-Path 'dist' "Daygo-$env:VERSION-amd64-installer.exe"
          if (-not (Test-Path $asset -PathType Leaf)) { throw "Windows installer not found: $asset" }
          gh release upload $env:RELEASE_TAG $asset --clobber

  verify_macos:
    needs: [prepare, macos]
    # Opt in only after both release assets have been signed and notarized.
    # Ordinary releases can publish unsigned installers for manual download.
    if: ${{ !cancelled() && vars.DAYGO_SIGNED_RELEASE_APPCAST == 'true' && needs.prepare.result == 'success' && needs.prepare.outputs.is_prerelease == 'false' && (needs.macos.result == 'success' || needs.macos.result == 'skipped') }}
    runs-on: macos-15
    environment: release
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Verify released macOS identity
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_TEAM_ID: ${{ secrets.DAYGO_MAC_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          asset="Daygo-${VERSION}-arm64.dmg"
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP"
          dmg="$RUNNER_TEMP/$asset"
          codesign --verify --strict --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          mount="$RUNNER_TEMP/daygo-mount"
          mkdir -p "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" -quiet "$dmg"
          trap 'hdiutil detach "$mount" -quiet' EXIT
          app="$mount/Daygo.app"
          test -d "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = 'io.github.jwz-git.Daygo'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
          test -n "$EXPECTED_TEAM_ID"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -Fxq "TeamIdentifier=$EXPECTED_TEAM_ID"
          spctl --assess --type execute --verbose=2 "$app"
          echo "sha256=$(shasum -a 256 "$dmg" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

  verify_windows:
    needs: [prepare, windows]
    if: ${{ !cancelled() && vars.DAYGO_SIGNED_RELEASE_APPCAST == 'true' && needs.prepare.result == 'success' && needs.prepare.outputs.is_prerelease == 'false' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    runs-on: windows-2025
    environment: release
    outputs:
      sha256: ${{ steps.verify.outputs.sha256 }}
    steps:
      - name: Verify released Windows installer identity
        id: verify
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.DAYGO_WIN_SIGNER_THUMBPRINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "Daygo-$env:VERSION-amd64-installer.exe"
          gh release download $env:RELEASE_TAG --repo $env:REPOSITORY --pattern $asset --dir $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer download failed.' }
          $signature = Get-AuthenticodeSignature (Join-Path $env:RUNNER_TEMP $asset)
          if ($signature.Status -ne 'Valid') { throw "Windows installer signature is $($signature.Status)." }
          if (-not $env:EXPECTED_SIGNER_THUMBPRINT) { throw 'Expected Windows signer thumbprint is not configured.' }
          if ($signature.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER_THUMBPRINT) { throw 'Windows installer signer does not match the pinned release identity.' }
          $sevenZip = (Get-Command 7z.exe -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip) { $sevenZip = Join-Path $env:ProgramFiles '7-Zip\7z.exe' }
          if (-not (Test-Path $sevenZip)) { throw '7-Zip is required to inspect the installer payload.' }
          $extract = Join-Path $env:RUNNER_TEMP 'daygo-installer-content'
          & $sevenZip x (Join-Path $env:RUNNER_TEMP $asset) "-o$extract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer extraction failed.' }
          foreach ($name in @('Daygo.exe', 'daygo_windows_native.dll', 'WinSparkle.dll')) {
            $files = @(Get-ChildItem -LiteralPath $extract -Filter $name -File -Recurse)
            if ($files.Count -ne 1) { throw "Expected one $name in the Windows installer, found $($files.Count)." }
            $innerSignature = Get-AuthenticodeSignature $files[0].FullName
            if ($innerSignature.Status -ne 'Valid' -or $innerSignature.SignerCertificate.Thumbprint -ne $env:EXPECTED_SIGNER_THUMBPRINT) {
              throw "$name is not signed by the pinned release identity."
            }
          }
          "sha256=$((Get-FileHash (Join-Path $env:RUNNER_TEMP $asset) -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  appcast:
    needs: [prepare, macos, windows, verify_macos, verify_windows]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.verify_macos.result == 'success' && needs.verify_windows.result == 'success' }}
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Download both release installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_MAC_SHA256: ${{ needs.verify_macos.outputs.sha256 }}
          EXPECTED_WINDOWS_SHA256: ${{ needs.verify_windows.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$REPOSITORY" --dir dist \
            --pattern "Daygo-${VERSION}-arm64.dmg" \
            --pattern "Daygo-${VERSION}-amd64-installer.exe"
          test -s "dist/Daygo-${VERSION}-arm64.dmg"
          test -s "dist/Daygo-${VERSION}-amd64-installer.exe"
          test "$(shasum -a 256 "dist/Daygo-${VERSION}-arm64.dmg" | cut -d ' ' -f 1)" = "$EXPECTED_MAC_SHA256"
          test "$(shasum -a 256 "dist/Daygo-${VERSION}-amd64-installer.exe" | cut -d ' ' -f 1)" = "$EXPECTED_WINDOWS_SHA256"

      - name: Sign installers and generate appcast
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.SPARKLE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPARKLE_ED25519_PRIVATE_KEY" || { echo 'Sparkle signing key is missing.' >&2; exit 1; }
          sparkle_dir="$(./scripts/bootstrap-updaters.sh)"
          signer="$sparkle_dir/bin/sign_update"
          mac="dist/Daygo-${VERSION}-arm64.dmg"
          windows="dist/Daygo-${VERSION}-amd64-installer.exe"
          mac_signature="$(printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" | "$signer" --ed-key-file - -p "$mac")"
          windows_signature="$(printf '%s' "$SPARKLE_ED25519_PRIVATE_KEY" | "$signer" --ed-key-file - -p "$windows")"
          test -n "$mac_signature" && test -n "$windows_signature"
          python3 scripts/generate-appcast.py --version "$VERSION" \
            --mac "$mac" --mac-signature "$mac_signature" \
            --windows "$windows" --windows-signature "$windows_signature" \
            --output dist/appcast.xml
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("dist/appcast.xml")'

      - name: Upload appcast to the same release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" dist/appcast.xml --clobber
